<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camera Control Overlay</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <video id="camera-feed" class="camera-feed" autoplay playsinline muted></video>
    <div class="overlay">
      <div class="lidar-side">
        <div class="lidar-map" aria-label="Live LiDAR map">
          <canvas id="lidar-canvas" class="lidar-canvas" width="420" height="420"></canvas>
          <div class="lidar-grid"></div>
          <div class="lidar-head">
            <span class="lidar-label">LiDAR</span>
            <span id="lidar-status" class="lidar-status">CONNECTING</span>
          </div>
        </div>

        <div id="secondary-feed-shell" class="secondary-feed-shell" aria-label="Secondary camera feed">
          <video id="secondary-feed" class="secondary-feed" autoplay playsinline muted></video>
          <button id="switch-camera" class="switch-camera" type="button" aria-label="Switch camera">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M17 8a5 5 0 0 0-8.5-3.5" />
              <path d="M7 8V5h3" />
              <path d="M7 16a5 5 0 0 0 8.5 3.5" />
              <path d="M17 16v3h-3" />
            </svg>
          </button>
          <button
            id="secondary-toggle"
            class="secondary-toggle"
            type="button"
            aria-label="Hide secondary camera feed"
            aria-expanded="true"
          >
            <span aria-hidden="true">‹</span>
          </button>
        </div>
      </div>

      <div class="settings-shell">
        <button
          id="settings-button"
          class="settings-button"
          type="button"
          aria-label="Open settings"
          aria-expanded="false"
          aria-controls="settings-menu"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 8.8A3.2 3.2 0 1 0 12 15.2A3.2 3.2 0 0 0 12 8.8Z" />
            <path d="M19.4 13.2V10.8l-1.8-.6a6.2 6.2 0 0 0-.5-1.2l.8-1.7-1.7-1.7-1.7.8a6.2 6.2 0 0 0-1.2-.5l-.6-1.8h-2.4l-.6 1.8a6.2 6.2 0 0 0-1.2.5l-1.7-.8-1.7 1.7.8 1.7a6.2 6.2 0 0 0-.5 1.2l-1.8.6v2.4l1.8.6a6.2 6.2 0 0 0 .5 1.2l-.8 1.7 1.7 1.7 1.7-.8a6.2 6.2 0 0 0 1.2.5l.6 1.8h2.4l.6-1.8a6.2 6.2 0 0 0 1.2-.5l1.7.8 1.7-1.7-.8-1.7a6.2 6.2 0 0 0 .5-1.2l1.8-.6Z" />
          </svg>
        </button>

        <div id="settings-menu" class="settings-menu" role="menu">
          <label class="settings-item" for="full-camera-view-toggle">
            <input id="full-camera-view-toggle" type="checkbox" />
            <span>Full camera view</span>
          </label>
        </div>

        <div id="pi-status-panel" class="pi-status-panel disconnected" aria-live="polite">
          <div class="pi-status-head">
            <span class="pi-status-dot" aria-hidden="true"></span>
            <span id="pi-connection-label" class="pi-connection-label">DISCONNECTED</span>
          </div>
          <div id="pi-temperature" class="pi-temperature">PI TEMP --.- F</div>
        </div>
      </div>

      <div class="controls" aria-label="Arrow controls">
        <button class="key key-up" data-key="ArrowUp" type="button" aria-label="Up">▲</button>
        <button class="key key-left" data-key="ArrowLeft" type="button" aria-label="Left">◀</button>
        <button class="key key-down" data-key="ArrowDown" type="button" aria-label="Down">▼</button>
        <button class="key key-right" data-key="ArrowRight" type="button" aria-label="Right">▶</button>
      </div>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
