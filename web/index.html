<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camera Control Overlay</title>
  <link rel="stylesheet" href="./styles.css?v=20260410-2" />
</head>
<body>
  <main id="app-root" class="app">
    <img id="camera-feed" class="camera-feed" alt="Primary Raspberry Pi camera feed" />
    <div class="overlay">
      <div class="lidar-side">
        <div class="lidar-map" aria-label="Live LiDAR map">
          <canvas id="lidar-canvas" class="lidar-canvas" width="420" height="420"></canvas>
          <div class="lidar-grid"></div>
          <div class="lidar-head">
            <span id="lidar-status" class="lidar-status sr-only">CONNECTING</span>
          </div>
        </div>

        <div class="lidar-zoom" aria-label="LiDAR zoom controls">
          <div class="lidar-zoom-head">
            <span class="lidar-zoom-label">Zoom</span>
            <span id="lidar-zoom-value" class="lidar-zoom-value">1.0x · 6000 mm</span>
          </div>
          <div class="lidar-zoom-row">
            <button id="lidar-zoom-out" class="lidar-zoom-button" type="button" aria-label="Zoom out LiDAR view">−</button>
            <input
              id="lidar-zoom-slider"
              class="lidar-zoom-slider"
              type="range"
              min="1"
              max="5"
              step="0.25"
              value="1"
              aria-label="LiDAR zoom level"
            />
            <button id="lidar-zoom-in" class="lidar-zoom-button" type="button" aria-label="Zoom in LiDAR view">+</button>
          </div>
        </div>

        <div class="camera-rail" aria-label="Front and back camera previews">
          <div id="primary-mini-feed-shell" class="primary-mini-feed-shell camera-panel" aria-label="Primary camera preview">
            <span id="primary-camera-label" class="camera-panel-label">Front</span>
            <img id="primary-mini-feed" class="secondary-feed" alt="Primary robot camera preview" />
          </div>

          <div id="secondary-feed-shell" class="secondary-feed-shell camera-panel" aria-label="Secondary camera feed">
            <span id="secondary-camera-label" class="camera-panel-label">Back</span>
            <img id="secondary-feed" class="secondary-feed" alt="Secondary robot camera feed" />
            <button id="switch-camera" class="switch-camera" type="button" aria-label="Swap front and back Pi camera feeds">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M17 8a5 5 0 0 0-8.5-3.5" />
                <path d="M7 8V5h3" />
                <path d="M7 16a5 5 0 0 0 8.5 3.5" />
                <path d="M17 16v3h-3" />
              </svg>
            </button>
            <button
              id="secondary-toggle"
              class="secondary-toggle"
              type="button"
              aria-label="Hide secondary camera feed"
              aria-expanded="true"
            >
              <span aria-hidden="true">‹</span>
            </button>
          </div>
        </div>
      </div>

      <div class="settings-shell">
        <button
          id="settings-button"
          class="settings-button"
          type="button"
          aria-label="Open settings"
          aria-expanded="false"
          aria-controls="settings-menu"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 8.8A3.2 3.2 0 1 0 12 15.2A3.2 3.2 0 0 0 12 8.8Z" />
            <path d="M19.4 13.2V10.8l-1.8-.6a6.2 6.2 0 0 0-.5-1.2l.8-1.7-1.7-1.7-1.7.8a6.2 6.2 0 0 0-1.2-.5l-.6-1.8h-2.4l-.6 1.8a6.2 6.2 0 0 0-1.2.5l-1.7-.8-1.7 1.7.8 1.7a6.2 6.2 0 0 0-.5 1.2l-1.8.6v2.4l1.8.6a6.2 6.2 0 0 0 .5 1.2l-.8 1.7 1.7 1.7 1.7-.8a6.2 6.2 0 0 0 1.2.5l.6 1.8h2.4l.6-1.8a6.2 6.2 0 0 0 1.2-.5l1.7.8 1.7-1.7-.8-1.7a6.2 6.2 0 0 0 .5-1.2l1.8-.6Z" />
          </svg>
        </button>

        <div id="settings-menu" class="settings-menu" role="menu">
          <label class="settings-item" for="full-camera-view-toggle">
            <input id="full-camera-view-toggle" type="checkbox" />
            <span>Full camera view</span>
          </label>

          <div class="settings-group">
            <div class="settings-group-head">
              <label class="settings-group-label" for="camera-framerate-slider">Camera FPS</label>
              <span id="camera-framerate-value" class="settings-group-value">6 FPS</span>
            </div>
            <input
              id="camera-framerate-slider"
              class="settings-slider"
              type="range"
              min="1"
              max="12"
              step="1"
              value="6"
              aria-label="Camera stream frame rate"
            />
          </div>

          <div class="settings-group">
            <div class="settings-group-head">
              <label class="settings-group-label" for="drive-speed-slider">Drive Speed</label>
              <span id="drive-speed-value" class="settings-group-value">35%</span>
            </div>
            <input
              id="drive-speed-slider"
              class="settings-slider"
              type="range"
              min="0.05"
              max="1"
              step="0.05"
              value="0.35"
              aria-label="Drive throttle limit"
            />
          </div>
        </div>

        <div id="recording-panel" class="recording-panel idle" aria-live="polite">
          <div class="recording-head">
            <span id="recording-state-label" class="recording-state-label">Recorder Idle</span>
            <span id="recording-dot" class="recording-dot" aria-hidden="true"></span>
          </div>
          <div id="recording-detail-label" class="recording-detail-label">Not recording</div>
          <div class="recording-actions">
            <button id="recording-toggle-button" class="recording-action-button recording-toggle-button" type="button" aria-label="Start recording" title="Start recording">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="5.4" />
              </svg>
              <span class="sr-only">Start Recording</span>
            </button>
            <button id="recording-pause-button" class="recording-action-button recording-secondary-button hidden" type="button" aria-label="Pause recording" title="Pause recording">
              <span id="recording-pause-icon" class="recording-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <rect x="7" y="5.5" width="3.2" height="13" rx="1.1" />
                  <rect x="13.8" y="5.5" width="3.2" height="13" rx="1.1" />
                </svg>
              </span>
              <span class="sr-only">Pause Recording</span>
            </button>
            <span id="recording-loading-indicator" class="recording-loading-indicator hidden" aria-hidden="true"></span>
            <a id="recording-download-link" class="recording-action-button recording-secondary-button recording-download-link hidden" href="#" download aria-label="Download recording" title="Download recording">
              <span class="recording-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M12 5v9" />
                  <path d="m7.5 10.5 4.5 4.5 4.5-4.5" />
                  <path d="M6 18.5h12" />
                </svg>
              </span>
              <span class="sr-only">Download Recording</span>
            </a>
          </div>
        </div>

        <button
          id="lidar-mode-button"
          class="lidar-mode-button"
          type="button"
          aria-pressed="false"
        >
          LiDAR View
        </button>

        <div id="pi-status-panel" class="pi-status-panel disconnected" aria-live="polite">
          <div class="pi-status-head">
            <span class="pi-status-dot" aria-hidden="true"></span>
            <span id="pi-connection-label" class="pi-connection-label">DISCONNECTED</span>
          </div>
          <div id="pi-temperature" class="pi-temperature">PI TEMP --.- F</div>
          <div id="pi-latency" class="pi-latency">LATENCY -- MS</div>
        </div>

        <div id="motor-status-panel" class="motor-status-panel unavailable" aria-live="polite">
          <div class="motor-status-head">
            <span id="motor-state-label" class="motor-state-label">MOTORS OFFLINE</span>
            <span id="motor-driver-label" class="motor-driver-label">--</span>
          </div>
          <div id="motor-detail-label" class="motor-detail-label">Waiting for motor status</div>
          <button id="motor-arm-button" class="motor-arm-button" type="button">Arm Motors</button>
        </div>
      </div>

      <div class="controls" aria-label="Arrow controls">
        <button class="key key-up" data-key="ArrowUp" type="button" aria-label="Up">▲</button>
        <button class="key key-left" data-key="ArrowLeft" type="button" aria-label="Left">◀</button>
        <button class="key key-down" data-key="ArrowDown" type="button" aria-label="Down">▼</button>
        <button class="key key-right" data-key="ArrowRight" type="button" aria-label="Right">▶</button>
      </div>
    </div>
  </main>

  <script src="./app.js?v=20260410-1"></script>
</body>
</html>
