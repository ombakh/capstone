[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Optional serial defaults. Adjust to your adapter if needed.
upload_speed = 921600

; ESC firmware defaults are defined in src/main.cpp. Override with build flags
; for a specific robot, for example:
; build_flags =
;   -D LEFT_ESC_PIN=18
;   -D RIGHT_ESC_PIN=19
;   -D ESC_MAX_SPEED=0.15f
