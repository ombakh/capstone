[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/cu.usbserial-210
monitor_port = /dev/cu.usbserial-210

; Current drivetrain uses bidirectional ESCs with centered neutral.
; Keep these values in sync with the ESC calibration you verify on the bench.
build_flags =
  -D ESC_BIDIRECTIONAL=1
  -D ESC_ARM_PULSE_US=1500
  -D ESC_NEUTRAL_PULSE_US=1500
  -D ESC_FORWARD_MIN_PULSE_US=1560
  -D ESC_FORWARD_MAX_PULSE_US=1900
  -D ESC_REVERSE_MIN_PULSE_US=1440
  -D ESC_REVERSE_MAX_PULSE_US=1100
